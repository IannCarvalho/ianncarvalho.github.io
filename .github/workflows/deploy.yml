name: Deploy to GitHub Pages

# Builda o CRA e publica no GitHub Pages usando o fluxo oficial do Pages
# (actions/deploy-pages). Usa o GITHUB_TOKEN automatico do proprio repo --
# NAO precisa de secret nem token manual. Dispara a cada push na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissoes que o deploy-pages exige (concedidas ao GITHUB_TOKEN automatico).
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy de cada vez.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
