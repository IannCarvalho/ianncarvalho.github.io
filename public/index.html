    />
    <!-- Link preview (LinkedIn, WhatsApp, Slack, X...). Their crawlers do
         not run JavaScript, so these tags have to be static here. -->
    <link rel="canonical" href="https://ianncarvalho.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iann Barbosa" />
    <meta property="og:url" content="https://ianncarvalho.github.io/" />
    <meta property="og:title" content="Iann Barbosa — AI/ML Engineer" />
    <meta
      property="og:description"
      content="AI Engineer bridging Data Science and Software Engineering — LLM pipelines, RAG and autonomous agents, shipped to production."
    />
    <meta property="og:image" content="https://ianncarvalho.github.io/avatar.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="800" />

    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <title>Iann Barbosa — AI/ML Engineer</title>
    <script>
      // Paint the saved theme before the JS bundle arrives: without this a
      // first visit stays white for the seconds it takes React to mount.
      (function () {
        var mode = 'dark';
        try {
          var saved = localStorage.getItem('themeMode');
          if (saved === 'light' || saved === 'dark') mode = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#f6f8fa' : '#0d1117');
      })();
    </script>
    <style>
      /* Only while #root is empty (before React mounts, or with JS off);
         after that CssBaseline paints the body with the theme. */
      html:has(#root:empty) { background: #0d1117; color: #e6edf3; }
      html[data-theme='light']:has(#root:empty) { background: #f6f8fa; color: #1f2328; }
    </style>
  </head>
